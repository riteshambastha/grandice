[project]
name = "grandice"
version = "0.1.0"
description = "A Cowork-class agentic workspace running on open-weight models"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # For the xlsx/pptx skills (§07). Under sandbox-exec the sandboxed exec
    # reuses this same venv (see sandbox._clean_env), so these must be
    # runtime deps, not dev-only — the docker sandbox instead bakes them
    # into its own image (see sandbox/Dockerfile).
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]
# The live-view dashboard. Optional: the CLI works fully without this group,
# so a headless/CI install doesn't pull in a web server it never runs.
web = ["fastapi>=0.115", "uvicorn>=0.30"]
# MCP connectors (§P3): the official client SDK plus the two reference
# servers this build ships (fetch, sqlite). Optional for the same reason as
# `web` — mcp_client.py is only ever imported if GRANDICE_MCP_CONNECTORS is
# set, so a build with none configured needs none of this installed.
#
# Pinned exactly, not floored — verified live (2026-09-12) that `mcp` 2.x
# breaks both servers (mcp-server-fetch still imports the pre-2.x `McpError`
# name outright; mcp-server-sqlite uses the pre-2.x decorator API). See
# mcp_client.py's module docstring before ever bumping these.
mcp = ["mcp==1.30.0", "mcp-server-fetch==2026.8.18", "mcp-server-sqlite==2025.4.25"]

[project.scripts]
grandice = "grandice.cli:main"
grandice-web = "grandice.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
