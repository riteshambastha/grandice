[project]
name = "grandice"
version = "0.1.0"
description = "A Cowork-class agentic workspace running on open-weight models"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
grandice = "grandice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
